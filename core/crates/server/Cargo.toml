[package]
name = "ohmydate-server"
description = "HTTP surface of the OhMyDate core: the packages/contracts API on loopback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ohmydate-core"
path = "src/main.rs"

# The core's side of the schema comparison tool (blueprint 15 §11 R13).
[[bin]]
name = "schema-verdict"
path = "src/bin/schema-verdict.rs"

[features]
# The movable clock for tests: `--clock-offset-ms` of the `ohmydate-core`
# binary and `system::ShiftedClock`. Off by default, and it must stay off in
# anything that is packaged: without it the option does not exist, so a
# shipped app cannot be started on a shifted clock (blueprint 15 §7.3).
test-clock = []

[dependencies]
ohmydate-app.workspace = true
ohmydate-domain.workspace = true
ohmydate-store.workspace = true
axum.workspace = true
getrandom.workspace = true
jiff.workspace = true
jsonschema.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
