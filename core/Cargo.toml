[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/scheduler",
  "crates/store",
  "crates/app",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
ohmydate-domain = { path = "crates/domain" }
ohmydate-store = { path = "crates/store" }
ohmydate-app = { path = "crates/app" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.4.3"
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
jsonschema = { version = "0.61.2", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
ryu-js = "1.0.3"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
