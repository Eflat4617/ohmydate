# GU-1 local-only stack (127.0.0.1). Start it through the wrapper, which uses
# absolute paths and sudo so cwd/HOME do not matter:
#   corepack pnpm local:secrets   # first run creates deploy/secrets/local/*.env
#   corepack pnpm local:stack up
# Secrets come only from deploy/secrets/local/{postgres,vikunja}.env via
# env_file. Never commit those files. All state is in named volumes, so
# `sudo docker compose` cannot create root-owned host directories.
name: ohmydate-local

services:
  postgres:
    restart: unless-stopped
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    env_file:
      - ../secrets/local/postgres.env
    environment:
      POSTGRES_USER: ohmydate
      POSTGRES_DB: planner
    ports: ["127.0.0.1:${POSTGRES_PORT:-55442}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmydate -d planner && psql -U ohmydate -d planner -Atc 'select 1' >/dev/null"]
      interval: 5s
      retries: 20

  vikunja-db-init:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    depends_on: { postgres: { condition: service_healthy } }
    env_file:
      - ../secrets/local/postgres.env
    entrypoint:
      - sh
      - -c
      - >-
        export PGPASSWORD="$$POSTGRES_PASSWORD";
        psql -h postgres -U ohmydate -d planner -tc "SELECT 1 FROM pg_database WHERE datname='vikunja'" | grep -q 1 || psql -h postgres -U ohmydate -d planner -c 'CREATE DATABASE vikunja';
        psql -h postgres -U ohmydate -d planner -tc "SELECT 1 FROM pg_database WHERE datname='planner'" | grep -q 1 || psql -h postgres -U ohmydate -d planner -c 'CREATE DATABASE planner'
    restart: "no"

  # A fresh named volume is root-owned (the image has no /app/vikunja/files to
  # copy ownership from) and Vikunja runs as uid 1000 -> "storage validation
  # failed: permission denied" crash loop. Fix ownership once, idempotently.
  vikunja-files-init:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:0 /files && chmod 0750 /files"]
    volumes: ["vikunja-files:/files"]
    restart: "no"

  vikunja:
    restart: unless-stopped
    image: vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
    depends_on:
      postgres: { condition: service_healthy }
      vikunja-db-init: { condition: service_completed_successfully }
      vikunja-files-init: { condition: service_completed_successfully }
    env_file:
      - ../secrets/local/vikunja.env
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:${VIKUNJA_PORT:-3466}/
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      # Local-only registration (127.0.0.1). Synthetic/local user only.
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_USER: ohmydate
      VIKUNJA_DATABASE_DATABASE: vikunja
    ports: ["127.0.0.1:${VIKUNJA_PORT:-3466}:3456"]
    volumes: ["vikunja-files:/app/vikunja/files"]

volumes:
  pgdata: {}
  vikunja-files: {}
